<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>짤/카드 스튜디오</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #e2e5ea;
    --text: #1f2328;
    --muted: #6b7280;
    --brand: #4f46e5;
    --brand-soft: #eef2ff;
    --danger: #dc2626;
    --ok: #059669;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .tag {
    font-size: 11px;
    color: var(--brand);
    background: var(--brand-soft);
    padding: 2px 8px;
    border-radius: 999px;
  }

  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; gap: 12px; padding: 12px; }
    .stage { order: 1; }
    .editor { order: 2; }
    .editor { position: static; top: auto; }
  }
  @media (max-width: 600px) {
    main { padding: 10px; gap: 10px; }
    .panel { padding: 12px; border-radius: 10px; }
    .panel h2 { font-size: 12px; margin-bottom: 10px; }
    header { padding: 12px 14px; }
    header h1 { font-size: 15px; }
    .ratio-tabs button { padding: 12px 0; font-size: 13px; }
    textarea { font-size: 15px; min-height: 80px; }
    input[type="color"] { height: 44px; }
    .btn { padding: 14px 12px; font-size: 14px; }
    .pos-grid { grid-template-columns: 28px 1fr 76px; gap: 8px 6px; }
    .pos-grid input[type="number"] { padding: 10px 6px; font-size: 13px; }
    .nudge-pad {
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 6px;
    }
    .nudge-pad button { font-size: 16px; border-radius: 8px; }
    .nudge-row { gap: 12px; flex-wrap: wrap; }
    .nudge-step select { padding: 8px 10px; font-size: 13px; }
    input[type="range"] { height: 28px; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    margin: 0 0 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 320px;
  }
  .canvas-wrap {
    position: relative;
    background:
      linear-gradient(45deg, #eef0f3 25%, transparent 25%),
      linear-gradient(-45deg, #eef0f3 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eef0f3 75%),
      linear-gradient(-45deg, transparent 75%, #eef0f3 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    max-width: 100%;
  }
  #preview {
    display: block;
    max-width: 100%;
    max-height: 70vh;
    width: auto;
    height: auto;
    cursor: grab;
    touch-action: none;
  }
  @media (max-width: 900px) { #preview { max-height: 55vh; } }
  @media (max-width: 600px) { #preview { max-height: 45vh; } .stage { min-height: 0; } }
  #preview:active { cursor: grabbing; }
  .hint {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 0 8px;
  }

  .editor { position: sticky; top: 76px; }
  @media (max-width: 900px) { .editor { position: static; } }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .file-drop {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 18px 12px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .file-drop:hover, .file-drop.dragover {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .file-drop input { display: none; }
  .file-name {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
  }
  .msg {
    margin-top: 8px;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.error { background: #fef2f2; color: var(--danger); }
  .msg.ok { background: #ecfdf5; color: var(--ok); }
  .msg.warn { background: #fffbeb; color: #b45309; }

  .ratio-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .ratio-tabs button {
    padding: 8px 0;
    font-size: 12px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .ratio-tabs button.active {
    background: var(--brand);
    color: #fff;
    border-color: var(--brand);
  }

  textarea, input[type="range"], input[type="color"], input[type="number"], input[type="text"] {
    width: 100%;
  }
  textarea {
    resize: vertical;
    min-height: 64px;
    padding: 8px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    background: #fff;
  }
  textarea:focus, input:focus {
    outline: 2px solid var(--brand-soft);
    outline-offset: 1px;
  }
  input[type="range"] { accent-color: var(--brand); }
  input[type="color"] {
    height: 36px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .val { font-size: 12px; color: var(--muted); min-width: 42px; text-align: right; }

  .pos-grid {
    display: grid;
    grid-template-columns: 44px 1fr 64px;
    gap: 6px 8px;
    align-items: center;
  }
  .pos-grid .axis {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .pos-grid input[type="number"] {
    padding: 6px;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    text-align: right;
    background: #fff;
  }
  .nudge-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .nudge-pad {
    display: grid;
    grid-template-columns: repeat(3, 28px);
    grid-template-rows: repeat(3, 28px);
    gap: 4px;
  }
  .nudge-pad button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    line-height: 1;
    touch-action: manipulation;
  }
  .nudge-pad button:active { background: var(--brand-soft); }
  .nudge-pad .empty { visibility: hidden; }
  .nudge-step {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .nudge-step select {
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    background: #fff;
  }

  .btn {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--line);
    margin-top: 8px;
  }
  .divider {
    height: 1px;
    background: var(--line);
    margin: 16px 0;
  }
  @media (max-width: 600px) { .divider { margin: 12px 0; } }

  /* JSON 저장/복원 영역 */
  .json-actions { display: grid; gap: 8px; }
  .json-actions .btn { margin-top: 0; }
  .json-file-label {
    display: block;
    text-align: center;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: #fff;
    cursor: pointer;
  }
  .json-file-label input { display: none; }
  .json-file-label:hover { border-color: var(--brand); }
  .json-info {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }
  .json-info code {
    background: #f3f4f6;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 10px;
  }

  /* 메타데이터 검증 결과 */
  .meta-result {
    font-size: 12px;
    line-height: 1.6;
    padding: 10px;
    border-radius: 8px;
    background: #f9fafb;
    border: 1px solid var(--line);
    margin-top: 8px;
    display: none;
  }
  .meta-result.show { display: block; }
  .meta-result .ok { color: var(--ok); font-weight: 600; }
  .meta-result .fail { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>짤/카드 스튜디오</h1>
  <span class="tag">prototype</span>
</header>

<main>
  <section class="panel stage">
    <div class="canvas-wrap">
      <canvas id="preview" width="480" height="480"></canvas>
    </div>
    <div class="hint">캔버스에서 드래그하거나 아래 정밀 조정 UI를 사용하세요.</div>
  </section>

  <section class="panel editor">
    <h2>1. 이미지 불러오기</h2>
    <div class="field">
      <label class="file-drop" id="fileDrop">
        클릭 또는 드래그하여 이미지 업로드
        <div style="font-size:11px;margin-top:4px;">PNG · JPEG만 지원</div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg" />
      </label>
      <div class="file-name" id="fileName"></div>
      <div class="msg" id="fileMsg"></div>
    </div>

    <div class="divider"></div>

    <h2>2. 화면비</h2>
    <div class="field">
      <div class="ratio-tabs" id="ratioTabs">
        <button data-ratio="1:1" class="active">1:1</button>
        <button data-ratio="4:5">4:5</button>
        <button data-ratio="9:16">9:16</button>
      </div>
    </div>

    <div class="divider"></div>

    <h2>3. 문구 편집</h2>
    <div class="field">
      <label for="textInput">문구 (줄바꿈 가능)</label>
      <textarea id="textInput" placeholder="문구를 입력하세요">가장자리 테스트
줄바꿈 두 번째 줄 👍🏽</textarea>
    </div>
    <div class="field">
      <label>크기</label>
      <div class="row">
        <input type="range" id="sizeInput" min="12" max="120" value="36" />
        <span class="val" id="sizeVal">36</span>
      </div>
    </div>
    <div class="field">
      <label>색상</label>
      <input type="color" id="colorInput" value="#ffffff" />
    </div>

    <div class="divider"></div>

    <h2>4. 문구 위치 정밀 조정</h2>
    <div class="field">
      <div class="pos-grid">
        <span class="axis">X</span>
        <input type="range" id="posXRange" min="0" max="100" step="0.5" value="50" />
        <input type="number" id="posXNum" min="0" max="100" step="0.5" value="50" />
        <span class="axis">Y</span>
        <input type="range" id="posYRange" min="0" max="100" step="0.5" value="50" />
        <input type="number" id="posYNum" min="0" max="100" step="0.5" value="50" />
      </div>

      <div class="nudge-row">
        <div class="nudge-pad">
          <span class="empty"></span>
          <button type="button" data-nudge="up" title="위로">↑</button>
          <span class="empty"></span>
          <button type="button" data-nudge="left" title="왼쪽">←</button>
          <button type="button" data-nudge="center" title="가운데">·</button>
          <button type="button" data-nudge="right" title="오른쪽">→</button>
          <span class="empty"></span>
          <button type="button" data-nudge="down" title="아래로">↓</button>
          <span class="empty"></span>
        </div>
        <div class="nudge-step">
          이동:
          <select id="nudgeStep">
            <option value="0.1">0.1%</option>
            <option value="0.5" selected>0.5%</option>
            <option value="1">1%</option>
            <option value="5">5%</option>
          </select>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <h2>5. 내보내기</h2>
    <button class="btn btn-primary" id="downloadBtn" disabled>PNG로 다운로드 (메타데이터 제거)</button>
    <div class="meta-result" id="metaResult"></div>

    <div class="divider"></div>

    <h2>6. 편집 상태 저장/복원 (JSON)</h2>
    <div class="field">
      <div class="json-actions">
        <button class="btn btn-ghost" id="saveJsonBtn">현재 상태 JSON 저장</button>
        <label class="json-file-label">
          JSON 불러오기
          <input type="file" id="loadJsonInput" accept="application/json,.json" />
        </label>
      </div>
      <div class="msg" id="jsonMsg"></div>
      <div class="json-info">
        검증 규칙: <code>version</code>, <code>text</code>, <code>size</code>,
        <code>color</code>, <code>ratio</code>, <code>textX</code>, <code>textY</code> 필수.
        값 범위(<code>size 12~120</code>, <code>textX/Y 0~1</code>) 확인 후 복원합니다.
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  const RATIOS = {
    '1:1':  { w: 1, h: 1 },
    '4:5':  { w: 4, h: 5 },
    '9:16': { w: 9, h: 16 }
  };
  const BASE = 480;
  const STATE_VERSION = 1;

  const state = {
    image: null,
    ratio: '1:1',
    text: '가장자리 테스트\n줄바꿈 두 번째 줄 👍🏽',
    size: 36,
    color: '#ffffff',
    textX: 0.5,
    textY: 0.5,
    dragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0
  };

  // DOM
  const fileDrop = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  const fileNameEl = document.getElementById('fileName');
  const fileMsg = document.getElementById('fileMsg');
  const ratioTabs = document.getElementById('ratioTabs');
  const textInput = document.getElementById('textInput');
  const sizeInput = document.getElementById('sizeInput');
  const sizeVal = document.getElementById('sizeVal');
  const colorInput = document.getElementById('colorInput');
  const downloadBtn = document.getElementById('downloadBtn');
  const metaResult = document.getElementById('metaResult');
  const posXRange = document.getElementById('posXRange');
  const posXNum = document.getElementById('posXNum');
  const posYRange = document.getElementById('posYRange');
  const posYNum = document.getElementById('posYNum');
  const nudgeStep = document.getElementById('nudgeStep');
  const saveJsonBtn = document.getElementById('saveJsonBtn');
  const loadJsonInput = document.getElementById('loadJsonInput');
  const jsonMsg = document.getElementById('jsonMsg');
  const canvas = document.getElementById('preview');
  const ctx = canvas.getContext('2d');

  // ---------- 공통 ----------
  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = 'msg show ' + type;
  }
  function clearMsg(el) {
    el.textContent = '';
    el.className = 'msg';
  }
  function canvasSizeFor(ratio) {
    const r = RATIOS[ratio];
    if (r.w >= r.h) return { w: BASE, h: Math.round(BASE * r.h / r.w) };
    return { w: Math.round(BASE * r.w / r.h), h: BASE };
  }
  function syncPositionUI() {
    const xPct = +(state.textX * 100).toFixed(1);
    const yPct = +(state.textY * 100).toFixed(1);
    posXRange.value = xPct; posXNum.value = xPct;
    posYRange.value = yPct; posYNum.value = yPct;
  }
  function syncRatioUI() {
    [...ratioTabs.children].forEach((b) =>
      b.classList.toggle('active', b.dataset.ratio === state.ratio)
    );
  }

  // ---------- 파일 ----------
  function handleFile(file) {
    clearMsg(fileMsg);
    fileNameEl.textContent = '';
    if (!file) return;

    const okTypes = ['image/png', 'image/jpeg'];
    const extOk = /\.(png|jpe?g)$/i.test(file.name);
    const typeOk = okTypes.includes(file.type) || extOk;

    if (!typeOk) {
      showMsg(fileMsg, '지원하지 않는 형식입니다. PNG 또는 JPEG를 올려주세요.', 'error');
      return;
    }
    fileNameEl.textContent = file.name;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      state.image = img;
      showMsg(fileMsg, '이미지를 불러왔습니다.', 'ok');
      downloadBtn.disabled = false;
      draw();
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      showMsg(fileMsg, '이미지를 읽을 수 없습니다. 파일이 손상되었을 수 있습니다.', 'error');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
  ['dragenter', 'dragover'].forEach((ev) =>
    fileDrop.addEventListener(ev, (e) => { e.preventDefault(); fileDrop.classList.add('dragover'); })
  );
  ['dragleave', 'drop'].forEach((ev) =>
    fileDrop.addEventListener(ev, (e) => { e.preventDefault(); fileDrop.classList.remove('dragover'); })
  );
  fileDrop.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  });

  // ---------- 편집 ----------
  ratioTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-ratio]');
    if (!btn) return;
    state.ratio = btn.dataset.ratio;
    syncRatioUI();
    draw();
  });
  textInput.addEventListener('input', () => { state.text = textInput.value; draw(); });
  sizeInput.addEventListener('input', () => {
    state.size = Number(sizeInput.value);
    sizeVal.textContent = state.size;
    draw();
  });
  colorInput.addEventListener('input', () => { state.color = colorInput.value; draw(); });

  function setPosition(xPct, yPct) {
    state.textX = Math.min(1, Math.max(0, xPct / 100));
    state.textY = Math.min(1, Math.max(0, yPct / 100));
    syncPositionUI();
    draw();
  }
  posXRange.addEventListener('input', () => setPosition(+posXRange.value, state.textY * 100));
  posYRange.addEventListener('input', () => setPosition(state.textX * 100, +posYRange.value));
  posXNum.addEventListener('change', () => setPosition(+posXNum.value || 0, state.textY * 100));
  posYNum.addEventListener('change', () => setPosition(state.textX * 100, +posYNum.value || 0));

  document.querySelectorAll('[data-nudge]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const step = Number(nudgeStep.value);
      const dir = btn.dataset.nudge;
      let x = state.textX * 100, y = state.textY * 100;
      if (dir === 'up')    y -= step;
      if (dir === 'down')  y += step;
      if (dir === 'left')  x -= step;
      if (dir === 'right') x += step;
      if (dir === 'center') { x = 50; y = 50; }
      setPosition(x, y);
    });
  });

  // ---------- 드래그 ----------
  function getPointerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }
  function onDown(evt) {
    if (!state.image) return;
    evt.preventDefault();
    const p = getPointerPos(evt);
    state.dragging = true;
    state.dragOffsetX = p.x - state.textX * canvas.width;
    state.dragOffsetY = p.y - state.textY * canvas.height;
  }
  function onMove(evt) {
    if (!state.dragging || !state.image) return;
    evt.preventDefault();
    const p = getPointerPos(evt);
    state.textX = Math.min(1, Math.max(0, (p.x - state.dragOffsetX) / canvas.width));
    state.textY = Math.min(1, Math.max(0, (p.y - state.dragOffsetY) / canvas.height));
    syncPositionUI();
    draw();
  }
  function onUp() { state.dragging = false; }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  // ---------- 렌더 ----------
  function draw() {
    const { w, h } = canvasSizeFor(state.ratio);
    canvas.width = w;
    canvas.height = h;
    ctx.clearRect(0, 0, w, h);

    if (state.image) {
      const iw = state.image.width, ih = state.image.height;
      const scale = Math.max(w / iw, h / ih);
      const dw = iw * scale, dh = ih * scale;
      ctx.drawImage(state.image, (w - dw) / 2, (h - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = '#e5e7eb';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#9ca3af';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('이미지를 불러오세요', w / 2, h / 2);
    }
    drawTextOn(ctx, w, h, 1);
  }

  function drawTextOn(c, w, h, scale) {
    const text = state.text || '';
    if (!text.trim()) return;

    const size = state.size * scale;
    const fontStack = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
    c.font = `600 ${size}px ${fontStack}`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';

    const lines = text.split('\n');
    const lineHeight = size * 1.35;
    const totalH = lineHeight * lines.length;
    const baseX = state.textX * w;
    const baseY = state.textY * h;
    const startY = baseY - totalH / 2 + lineHeight / 2;

    c.lineJoin = 'round';
    c.miterLimit = 2;
    c.shadowColor = 'rgba(0,0,0,.35)';
    c.shadowBlur = 4 * scale;
    c.shadowOffsetY = 1 * scale;

    lines.forEach((line, i) => {
      const y = startY + i * lineHeight;
      c.strokeStyle = 'rgba(0,0,0,.55)';
      c.lineWidth = Math.max(2, size * 0.08);
      c.strokeText(line, baseX, y);
      c.fillStyle = state.color;
      c.fillText(line, baseX, y);
    });

    c.shadowColor = 'transparent';
    c.shadowBlur = 0;
    c.shadowOffsetY = 0;
  }

  // ---------- ★ 다운로드 + 메타데이터 제거 ----------
  downloadBtn.addEventListener('click', () => {
    if (!state.image) return;
    const ratio = RATIOS[state.ratio];
    const LONG = 1080;
    let outW, outH;
    if (ratio.w >= ratio.h) { outW = LONG; outH = Math.round(LONG * ratio.h / ratio.w); }
    else { outH = LONG; outW = Math.round(LONG * ratio.w / ratio.h); }

    const out = document.createElement('canvas');
    out.width = outW;
    out.height = outH;
    const octx = out.getContext('2d');

    // ★ 캔버스에 다시 그리기 = 원본 메타데이터(EXIF/GPS) 미포함
    const iw = state.image.width, ih = state.image.height;
    const scale = Math.max(outW / iw, outH / ih);
    const dw = iw * scale, dh = ih * scale;
    octx.drawImage(state.image, (outW - dw) / 2, (outH - dh) / 2, dw, dh);

    const textScale = outW / canvas.width;
    drawTextOn(octx, outW, outH, textScale);

    out.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `zzal-${state.ratio.replace(':', 'x')}-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      // ★ 검증 결과 표시
      showMetadataVerification(outW, outH);
    }, 'image/png');
  });

  // 메타데이터 검증(캔버스 재렌더 = 메타 없음 확인)
  function showMetadataVerification(w, h) {
    metaResult.className = 'meta-result show';
    metaResult.innerHTML = `
      <div><span class="ok">✅ 메타데이터 제거됨</span> (캔버스 재렌더 방식)</div>
      <div style="color:var(--muted); margin-top:4px;">
        출력: ${w} × ${h}px · PNG<br>
        EXIF / GPS / 촬영일시 / 기기정보 / 비밀값 미포함<br>
        (원본 이미지는 읽기만 하고, 출력은 새 캔버스에서 생성됩니다.)
      </div>
    `;
  }

  // ---------- ★ JSON 저장 ----------
  function buildStateJson() {
    return {
      version: STATE_VERSION,
      text: state.text,
      size: state.size,
      color: state.color,
      ratio: state.ratio,
      textX: +state.textX.toFixed(4),
      textY: +state.textY.toFixed(4),
      // 이미지 자체는 저장하지 않음 (용량/개인정보)
      // 필요 시 base64로 저장 가능하나 여기선 편집 상태만
      hasImage: !!state.image,
      savedAt: new Date().toISOString()
    };
  }

  saveJsonBtn.addEventListener('click', () => {
    const data = buildStateJson();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zzal-state-${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showMsg(jsonMsg, 'JSON을 저장했습니다. (이미지 자체는 포함되지 않음)', 'ok');
  });

  // ---------- ★ JSON 복원 + 검증 ----------
  const REQUIRED_FIELDS = ['version', 'text', 'size', 'color', 'ratio', 'textX', 'textY'];

  function validateStateJson(obj) {
    const errors = [];

    if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) {
      return { ok: false, errors: ['최상위가 객체가 아닙니다.'] };
    }

    // 필수 필드
    REQUIRED_FIELDS.forEach((f) => {
      if (!(f in obj)) errors.push(`필수 필드 누락: ${f}`);
    });

    if (errors.length) return { ok: false, errors };

    // 타입/범위
    if (typeof obj.version !== 'number') errors.push('version은 숫자여야 합니다.');
    if (typeof obj.text !== 'string') errors.push('text는 문자열이어야 합니다.');
    if (typeof obj.size !== 'number' || obj.size < 12 || obj.size > 120)
      errors.push('size는 12~120 사이 숫자여야 합니다.');
    if (typeof obj.color !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(obj.color))
      errors.push('color는 #RRGGBB 형식이어야 합니다.');
    if (!RATIOS[obj.ratio]) errors.push(`ratio는 ${Object.keys(RATIOS).join(', ')} 중 하나여야 합니다.`);
    if (typeof obj.textX !== 'number' || obj.textX < 0 || obj.textX > 1)
      errors.push('textX는 0~1 사이 숫자여야 합니다.');
    if (typeof obj.textY !== 'number' || obj.textY < 0 || obj.textY > 1)
      errors.push('textY는 0~1 사이 숫자여야 합니다.');

    return { ok: errors.length === 0, errors };
  }

  function applyStateJson(obj) {
    state.text = obj.text;
    state.size = obj.size;
    state.color = obj.color;
    state.ratio = obj.ratio;
    state.textX = obj.textX;
    state.textY = obj.textY;

    textInput.value = state.text;
    sizeInput.value = state.size;
    sizeVal.textContent = state.size;
    colorInput.value = state.color;
    syncRatioUI();
    syncPositionUI();
    draw();
  }

  loadJsonInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    clearMsg(jsonMsg);

    const reader = new FileReader();
    reader.onload = () => {
      const raw = reader.result;

      // 1) JSON 파싱 (손상 JSON 방어)
      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (err) {
        showMsg(jsonMsg, '손상된 JSON입니다. 문법 오류를 확인하세요.', 'error');
        return;
      }

      // 2) 스키마 검증 (필수 필드 누락 등)
      const v = validateStateJson(parsed);
      if (!v.ok) {
        showMsg(jsonMsg, '검증 실패: ' + v.errors.join(' / '), 'error');
        return;
      }

      // 3) 복원
      applyStateJson(parsed);
      showMsg(jsonMsg, 'JSON 복원 완료. (이미지는 다시 업로드하세요.)', 'ok');
    };
    reader.onerror = () => {
      showMsg(jsonMsg, '파일을 읽을 수 없습니다.', 'error');
    };
    reader.readAsText(file);

    // 같은 파일 다시 선택 가능하게
    e.target.value = '';
  });

  // ---------- 초기 ----------
  sizeVal.textContent = state.size;
  syncPositionUI();
  syncRatioUI();
  draw();

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(draw, 120);
  });
})();
</script>
</body>
</html>
